name: Build MOTO DIAG PRO Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - desktop-universal-abs-foundation
    paths:
      - SEYFI_USTA_MASAUSTE.py
      - diagnostic_engine.py
      - profiles/**
      - third_party/yamaha-cp3-can/**
      - third_party/yamaha-r9-2026/**
      - tests/**
      - desktop_requirements.txt
      - installer/MOTO_DIAG_PRO.iss
      - third_party/SavvyCAN/**
      - .github/workflows/desktop-installer.yml

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          python -m pip install -r desktop_requirements.txt

      - name: Verify Python source
        shell: pwsh
        run: |
          python -m py_compile SEYFI_USTA_MASAUSTE.py diagnostic_engine.py adaptive_ecu_learning.py
          python -m unittest discover -s tests -v

      - name: Build self-contained Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "MOTO DIAG PRO" --add-data "assets;assets" --add-data "profiles;profiles" --add-data "third_party/yamaha-cp3-can;third_party/yamaha-cp3-can" --add-data "third_party/yamaha-r9-2026;third_party/yamaha-r9-2026" --collect-all cantools --hidden-import engineio.async_drivers.threading --hidden-import can.interfaces.socketcan SEYFI_USTA_MASAUSTE.py

      - name: Bundle SavvyCAN V220 (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "SavvyCAN-Windows_x64_CIBuild.zip"
          $extract = Join-Path $env:RUNNER_TEMP "SavvyCAN-V220"
          $target = "dist/MOTO DIAG PRO/SavvyCAN"
          Invoke-WebRequest -Uri "https://github.com/collin80/SavvyCAN/releases/download/V220/SavvyCAN-Windows_x64_CIBuild.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $exe = Get-ChildItem -Path $extract -Filter "SavvyCAN.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "SavvyCAN.exe bulunamadı; upstream arşiv yapısı değişmiş olabilir." }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path (Join-Path $exe.Directory.FullName "*") -Destination $target -Recurse -Force
          Copy-Item -Path "third_party/SavvyCAN/LICENSE.txt" -Destination (Join-Path $target "LICENSE-SavvyCAN.txt") -Force
          if (-not (Test-Path (Join-Path $target "SavvyCAN.exe"))) { throw "SavvyCAN pakete doğru kopyalanamadı." }
          Write-Host "SavvyCAN V220 uygulama klasörüne paketlendi."
      - name: Download Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/redist | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "installer/redist/vc_redist.x64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Create Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/MOTO_DIAG_PRO.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-DIAG-PRO-Windows-Installer
          path: release/MOTO-DIAG-PRO-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
