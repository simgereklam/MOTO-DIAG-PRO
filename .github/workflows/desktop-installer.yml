name: Build MOTO DIAG PRO Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - SEYFI_USTA_MASAUSTU.py
      - seyfi_voice.py
      - desktop_requirements.txt
      - scripts/prepare_desktop_assets.py
      - installer/MOTO_DIAG_PRO.iss
      - .github/workflows/desktop-installer.yml

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install CPU-only PyTorch
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          python -m pip install -r desktop_requirements.txt

      - name: Prepare bundled offline Turkish speech models
        shell: pwsh
        run: |
          python scripts/prepare_desktop_assets.py

      - name: Verify Python source
        shell: pwsh
        run: |
          python -m py_compile SEYFI_USTA_MASAUSTU.py seyfi_voice.py scripts/prepare_desktop_assets.py

      - name: Build self-contained Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "MOTO DIAG PRO" --add-data "assets;assets" --collect-all torch --collect-all pocket_tts --collect-all pocket_tts_turkish --collect-all vosk --collect-all sounddevice --hidden-import engineio.async_drivers.threading --hidden-import can.interfaces.socketcan SEYFI_USTA_MASAUSTU.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Create Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/MOTO_DIAG_PRO.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-DIAG-PRO-Windows-Installer
          path: release/MOTO-DIAG-PRO-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
