# Build the unified Windows desktop installer
# Rebuild after correcting the qmake release output copy path.
name: Build MOTO DIAG PRO Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - desktop-universal-abs-foundation
      - moto-diag-savvycan-unified
    paths:
      - SEYFI_USTA_MASAUSTU.py
      - desktop_requirements.txt
      - desktop_backend.py
      - savvycan_bridge.py
      - scripts/**
      - installer/MOTO_DIAG_PRO.iss
      - third_party/SavvyCAN/**
      - .github/workflows/desktop-installer.yml

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          python -m pip install -r desktop_requirements.txt

      - name: Verify Python integration source
        shell: pwsh
        run: |
          python -m py_compile SEYFI_USTA_MASAUSTE.py desktop_backend.py savvycan_bridge.py scripts/integrate_savvycan.py scripts/test_savvycan_bridge.py
          python scripts/test_savvycan_bridge.py

      - name: Build local MOTO DIAG PRO backend
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "MOTO-DIAG-PRO-Backend" --add-data "assets;assets" --add-data "static;static" --hidden-import engineio.async_drivers.threading --hidden-import can.interfaces.socketcan desktop_backend.py
          if (-not (Test-Path "dist/MOTO-DIAG-PRO-Backend.exe")) { throw "MOTO DIAG PRO backend executable was not created." }

      - name: Install Qt 6 with WebEngine and CAN bus modules
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtwebengine qtwebchannel qtpositioning qtserialbus qtserialport"

      - name: Prepare MSVC x64 build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch and patch SavvyCAN as the unified application shell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:RUNNER_TEMP "SavvyCAN"
          git clone --depth 1 --branch QT6WIP https://github.com/collin80/SavvyCAN.git $source
          python scripts/integrate_savvycan.py --source $source --backend "$((Resolve-Path 'dist/MOTO-DIAG-PRO-Backend.exe').Path)"
          Push-Location $source
          qmake SavvyCAN.pro
          if ($LASTEXITCODE -ne 0) { throw "qmake failed: $LASTEXITCODE" }
          nmake
          if ($LASTEXITCODE -ne 0) { throw "SavvyCAN build failed: $LASTEXITCODE" }
          Pop-Location
          $target = "dist/MOTO DIAG PRO"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -LiteralPath (Join-Path $source "release/MOTO_DIAG_PRO.exe") -Destination (Join-Path $target "MOTO DIAG PRO.exe") -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $target "backend") | Out-Null
          Copy-Item -Path (Join-Path $source "backend/*") -Destination (Join-Path $target "backend") -Recurse -Force
          windeployqt --release --compiler-runtime --no-translations --webengine --dir $target (Join-Path $target "MOTO DIAG PRO.exe")
          Copy-Item -LiteralPath "third_party/SavvyCAN/LICENSE.txt" -Destination (Join-Path $target "LICENSE-SavvyCAN.txt") -Force
          if (-not (Test-Path (Join-Path $target "MOTO DIAG PRO.exe"))) { throw "Unified MOTO DIAG PRO executable was not created." }
          if (-not (Test-Path (Join-Path $target "backend/MOTO-DIAG-PRO-Backend.exe"))) { throw "Embedded diagnostic backend is missing." }
          Write-Host "Unified single-window MOTO DIAG PRO + SavvyCAN package prepared."

      - name: Download Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/redist | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "installer/redist/vc_redist.x64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Create Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/MOTO_DIAG_PRO.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-DIAG-PRO-Windows-Installer
          path: release/MOTO-DIAG-PRO-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
