
name: MOTO DIAG PRO APK

on:
  push:
    branches:
      - main
      - master
      - seyfi-usta-tablet-responsive
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: XML Manifest kontrolü
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('MANIFEST XML GECERLI')"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Gradle sürümünü doğrula
        run: gradle --version

      - name: Sherpa-ONNX ve Türkçe Whisper Base INT8 modelini APK içine ekle
        run: |
          mkdir -p app/libs app/src/main/assets/sherpa-whisper-base /tmp/sherpa-whisper-base
          curl --fail --location --retry 4 --retry-delay 3 --retry-all-errors \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" \
            --output app/libs/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar" | sha256sum --check

          curl --fail --location --retry 4 --retry-delay 3 --retry-all-errors \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.tar.bz2" \
            --output /tmp/sherpa-whisper-base/model.tar.bz2
          MODEL_BYTES="$(stat -c%s /tmp/sherpa-whisper-base/model.tar.bz2)"
          test "$MODEL_BYTES" -ge 190000000
          test "$MODEL_BYTES" -le 220000000
          tar -xjf /tmp/sherpa-whisper-base/model.tar.bz2 -C /tmp/sherpa-whisper-base \
            --wildcards '*base-encoder.int8.onnx' '*base-decoder.int8.onnx' '*base-tokens.txt'
          MODEL_ROOT="$(dirname "$(find /tmp/sherpa-whisper-base -type f -name base-encoder.int8.onnx -print -quit)")"
          test -f "$MODEL_ROOT/base-encoder.int8.onnx"
          test -f "$MODEL_ROOT/base-decoder.int8.onnx"
          test -f "$MODEL_ROOT/base-tokens.txt"
          cp "$MODEL_ROOT/base-encoder.int8.onnx" app/src/main/assets/sherpa-whisper-base/
          cp "$MODEL_ROOT/base-decoder.int8.onnx" app/src/main/assets/sherpa-whisper-base/
          cp "$MODEL_ROOT/base-tokens.txt" app/src/main/assets/sherpa-whisper-base/
          test "$(stat -c%s app/src/main/assets/sherpa-whisper-base/base-encoder.int8.onnx)" -ge 20000000
          test "$(stat -c%s app/src/main/assets/sherpa-whisper-base/base-decoder.int8.onnx)" -ge 100000000
          test "$(stat -c%s app/src/main/assets/sherpa-whisper-base/base-tokens.txt)" -ge 500000
          cp THIRD_PARTY_NOTICES.md app/src/main/assets/THIRD_PARTY_NOTICES.txt
          echo "Sherpa-ONNX AAR ve Whisper Base INT8 assets hazır."
          du -sh app/libs/sherpa-onnx-2.0.1.aar app/src/main/assets/sherpa-whisper-base

      - name: Çevrimdışı yapay zekâ modelini APK içine ekle
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 4 --retry-delay 3 --retry-all-errors \
            "https://huggingface.co/litert-community/Qwen3-0.6B/resolve/e6bb3e4a1eb3f663153f0c1c12b735d64be657a7/Qwen3-0.6B_dynamic_wi4b32_afp32_gpu_composites.litertlm?download=true" \
            --output app/src/main/assets/seyfi_model.litertlm
          MODEL_BYTES="$(stat -c%s app/src/main/assets/seyfi_model.litertlm)"
          test "$MODEL_BYTES" -ge 300000000
          test "$MODEL_BYTES" -le 400000000
          echo "Seyfi Usta yapay zekâ modeli APK assets içine alındı: $MODEL_BYTES bayt"

      - name: Komut yönlendirici birim testleri
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: APK oluştur
        run: gradle :app:assembleDebug --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-DIAG-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
