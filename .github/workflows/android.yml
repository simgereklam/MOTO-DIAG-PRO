
name: MOTO DIAG PRO APK

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - seyfi-offline-stability
      - seyfi-ai-diagnostics-integration
  workflow_dispatch:

concurrency:
  group: moto-diag-pro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: XML Manifest kontrolü
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('MANIFEST XML GECERLI')"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Gradle sürümünü doğrula
        run: gradle --version

      - name: Türkçe çevrimdışı Vosk modelini hazırla
        run: echo "Model Gradle preBuild aşamasında indirilip APK assets içine paketlenecek."

      - name: Türkçe çevrimdışı Vosk modelini APK assets içine indir
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/model-tr /tmp/vosk-tr
          curl -fL --retry 3 "https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip" -o /tmp/vosk-tr/model.zip
          unzip -q /tmp/vosk-tr/model.zip -d /tmp/vosk-tr
          MODEL_DIR="$(find /tmp/vosk-tr -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$MODEL_DIR"
          cp -a "$MODEL_DIR"/. app/src/main/assets/model-tr/
          # Turkish small model uses Vosk's supported flat legacy layout.
          test -f app/src/main/assets/model-tr/final.mdl
          test -f app/src/main/assets/model-tr/mfcc.conf
          test -f app/src/main/assets/model-tr/Gr.fst
          test -f app/src/main/assets/model-tr/HCLr.fst
          test -f app/src/main/assets/model-tr/uuid || echo "vosk-model-small-tr-0.3" > app/src/main/assets/model-tr/uuid
          echo "Türkçe çevrimdışı model APK assets içine hazırlandı."
      - name: Hazır model bağımlılığı olmadığını doğrula
        run: |
          ! grep -R -n -E 'com[.]google[.]ai[.]edge[.]litertlm|litertlm-android|litert-community' app/src/main app/build.gradle.kts
          echo "Hazır model ve LiteRT-LM bağımlılığı bulunamadı."

      - name: Seyfi komut öz testlerini çalıştır
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: APK oluştur
        run: gradle :app:assembleDebug --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-DIAG-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
