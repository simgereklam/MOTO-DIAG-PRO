
name: MOTO DIAG PRO APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: XML Manifest kontrolü
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('MANIFEST XML GECERLI')"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Gradle sürümünü doğrula
        run: gradle --version

      - name: Seyfi Usta yerel yapay zekâ modelini APK içine ekle
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 4 --retry-delay 3 --retry-all-errors \
            --user-agent "MOTO-DIAG-PRO-Android/1.0" \
            "https://huggingface.co/litert-community/Qwen3-0.6B/resolve/main/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm?download=true&cachebust=${GITHUB_RUN_ID}" \
            --header "Cache-Control: no-cache" \
            --output app/src/main/assets/seyfi_model.litertlm
          echo "96491bb0f78fa68098bf8f1d3628194c97041aff7894f8cc29303b3acdb877a9  app/src/main/assets/seyfi_model.litertlm" | sha256sum --check
          test "$(stat -c%s app/src/main/assets/seyfi_model.litertlm)" -eq 344686592

      - name: APK oluştur
        run: gradle :app:assembleDebug --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-DIAG-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
