
name: MOTO DIAG PRO APK

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - seyfi-offline-stability
      - seyfi-ai-diagnostics-integration
  workflow_dispatch:

concurrency:
  group: moto-diag-pro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: XML Manifest kontrolü
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('MANIFEST XML GECERLI')"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Gradle sürümünü doğrula
        run: gradle --version

      - name: Vosk kullanılmadığını doğrula
        run: |
          ! grep -R -n -E 'com[.]alphacephei:vosk|org[.]vosk|vosk-android|jna:5[.]18' app/src/main app/build.gradle.kts
          echo "Vosk bağımlılığı ve kod referansı bulunamadı."

      - name: Hazır model bağımlılığı olmadığını doğrula
        run: |
          ! grep -R -n -E 'com[.]google[.]ai[.]edge[.]litertlm|litertlm-android|litert-community' app/src/main app/build.gradle.kts
          echo "Hazır model ve LiteRT-LM bağımlılığı bulunamadı."

      - name: Seyfi komut öz testlerini çalıştır
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: APK oluştur
        run: gradle :app:assembleDebug --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-DIAG-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
