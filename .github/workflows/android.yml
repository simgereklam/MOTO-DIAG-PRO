
name: MOTO DIAG PRO APK

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - seyfi-offline-stability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: XML Manifest kontrolü
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('MANIFEST XML GECERLI')"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Gradle sürümünü doğrula
        run: gradle --version

      - name: Vosk kullanılmadığını doğrula
        run: |
          ! grep -R -n -E 'com[.]alphacephei:vosk|org[.]vosk|vosk-android|jna:5[.]18' app/src/main app/build.gradle.kts
          echo "Vosk bağımlılığı ve kod referansı bulunamadı."

      - name: Qwen3 0.6B yapay zekâ modelini APK içine göm
        run: |
          MODEL="app/src/main/assets/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm"
          mkdir -p app/src/main/assets
          curl --fail --location --retry 4 --retry-delay 3 --retry-all-errors \
            "https://huggingface.co/litert-community/Qwen3-0.6B/resolve/e6bb3e4a1eb3f663153f0c1c12b735d64be657a7/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm" \
            --output "$MODEL"
          echo "03e7da1eb1108b50dffaa9bb52cc7bcbad2eb0c66ca990267f480c1e545d2856  $MODEL" | sha256sum --check
          test "$(stat -c%s "$MODEL")" -eq 344671744
          echo "Qwen3 0.6B modeli APK assets içine doğrulanarak eklendi."
          du -h "$MODEL"

      - name: APK içinde model ve ses dosyalarını doğrula
        run: |
          test -f app/src/main/assets/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm
          test ! -f app/src/main/assets/seyfi_model.litertlm
          echo "Qwen3 0.6B modeli APK içine gömüldü; ilk kurulumda internet gerekmeyecek."

      - name: Seyfi komut öz testlerini çalıştır
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: APK oluştur
        run: gradle :app:assembleDebug --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-DIAG-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
