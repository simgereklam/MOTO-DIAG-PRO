
name: MOTO DIAG PRO APK

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - seyfi-offline-stability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: XML Manifest kontrolü
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('MANIFEST XML GECERLI')"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Gradle sürümünü doğrula
        run: gradle --version

      - name: Türkçe çevrimdışı konuşma modelini ekle
        run: |
          mkdir -p /tmp/vosk-tr app/src/main/assets/model-tr
          curl --fail --location --retry 4 --retry-delay 3 --retry-all-errors \
            "https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip" \
            --output /tmp/vosk-tr/model.zip
          echo "8c8d07cec1bce31add14967c16891c84152cdf76d391e33c08278119b9ea96e5  /tmp/vosk-tr/model.zip" | sha256sum --check
          unzip -q /tmp/vosk-tr/model.zip -d /tmp/vosk-tr
          MODEL_FILE="$(find /tmp/vosk-tr -type f -name final.mdl -print -quit)"
          test -n "$MODEL_FILE"
          MODEL_ROOT="$(dirname "$MODEL_FILE")"
          test -f "$MODEL_ROOT/Gr.fst"
          test -f "$MODEL_ROOT/HCLr.fst"
          test -f "$MODEL_ROOT/word_boundary.int"
          cp -a "$MODEL_ROOT"/. app/src/main/assets/model-tr/
          printf '%s\n' "$GITHUB_SHA" > app/src/main/assets/model-tr/uuid
          test -f app/src/main/assets/model-tr/uuid
          echo "Türkçe Vosk model assets hazır."
          du -sh app/src/main/assets/model-tr

      - name: Çevrimdışı yapay zekâ modelini APK içine ekle
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 4 --retry-delay 3 --retry-all-errors \
            "https://huggingface.co/litert-community/Qwen3-0.6B/resolve/e6bb3e4a1eb3f663153f0c1c12b735d64be657a7/Qwen3-0.6B_dynamic_wi4b32_afp32_gpu_composites.litertlm?download=true" \
            --output app/src/main/assets/seyfi_model.litertlm
          MODEL_BYTES="$(stat -c%s app/src/main/assets/seyfi_model.litertlm)"
          test "$MODEL_BYTES" -ge 300000000
          test "$MODEL_BYTES" -le 400000000
          echo "Seyfi Usta yapay zekâ modeli APK assets içine alındı: $MODEL_BYTES bayt"

      - name: APK oluştur
        run: gradle :app:assembleDebug --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-DIAG-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
